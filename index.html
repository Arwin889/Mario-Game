<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game" aria-label="Static Mario game scene">
      <canvas id="game-canvas"></canvas>
      <section id="win-panel" aria-live="polite">
        <div class="confetti" aria-hidden="true">✦　•　✧　•　✦</div>
        <div id="panel-emoji" class="win-emoji" aria-hidden="true">🥳</div>
        <h1 id="panel-title">You Win!</h1>
        <p id="final-score">Coins collected: 0 / 10</p>
        <button id="play-again" type="button">Play again</button>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
